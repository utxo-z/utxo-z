name: Build and Test

on:
  push:
    branches: [main, master, 'release/**', 'hotfix/**']
    tags:
      - v*
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.build-version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔧 Determine version
        id: version
        uses: ./.github/actions/determine-version
        with:
          github-ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          run-number: ${{ github.run_number }}

      - name: 📊 Build configuration summary
        run: |
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.build-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY

  build:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: 🐧 Linux x86_64 GCC 15
            configure-preset: conan-release
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: macos-15
            name: 🍎 macOS arm64 Apple Clang 17
            configure-preset: conan-release
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: windows-2025
            name: 🪟 Windows x64 MSVC 2025
            configure-preset: conan-default
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: ubuntu-24.04
            name: 🧹 Linux x86_64 GCC 15 ASAN+UBSAN
            configure-preset: conan-debug
            build-preset: conan-debug
            build-type: Debug
            sanitizer: "address,undefined"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Install Conan
        run: |
          pipx install conan
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 📦 Install dependencies
        run: |
          conan install . -of build --version=${{ needs.setup.outputs.build-version }} --build=missing -s build_type=${{ matrix.build-type }} -s compiler.cppstd=23 -o sanitizer=${{ matrix.sanitizer }}

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset ${{ matrix.configure-preset }}

      - name: 🔨 Build
        run: |
          cmake --build --preset ${{ matrix.build-preset }} --parallel

      - name: 🧪 Run tests
        run: |
          ctest --preset ${{ matrix.build-preset }} --output-on-failure

  publish:
    needs: [setup, build]
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: 📦 Publish Linux x86_64
          - os: macos-15
            name: 📦 Publish macOS arm64
          - os: windows-2025
            name: 📦 Publish Windows x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Install Conan
        run: |
          pipx install conan
          conan --version

      - name: 🔧 Configure Conan
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          conan profile detect --force
          conan remote add kth https://packages.kth.cash/api/
          conan remote login kth $CONAN_LOGIN_USERNAME -p $CONAN_PASSWORD

      - name: 📦 Create package
        run: |
          conan create . --version=${{ needs.setup.outputs.build-version }} --build=missing -s build_type=Release -s compiler.cppstd=23 -o with_tests=False -o with_examples=False -o with_benchmarks=False

      - name: 🚀 Upload to Conan remote
        run: |
          conan upload utxoz/${{ needs.setup.outputs.build-version }} -r kth -c

  build-wasm:
    needs: [setup]
    runs-on: ubuntu-latest
    name: 🌐 WebAssembly (Emscripten)

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Install Conan
        run: |
          pipx install conan
          conan --version

      - name: 🔧 Setup Conan profiles
        run: |
          conan profile detect --force

          cat > ~/.conan2/profiles/ems2 <<'EOF'
          [settings]
          arch=wasm
          build_type=Release
          compiler=clang
          compiler.cppstd=23
          compiler.libcxx=libc++
          compiler.version=14
          os=Emscripten

          [tool_requires]
          emsdk/3.1.73

          [buildenv]
          CC_FOR_BUILD=clang
          CXX_FOR_BUILD=clang++
          EOF

      - name: 📦 Install dependencies
        run: |
          conan install . -of build --version=${{ needs.setup.outputs.build-version }} --build=missing -pr ems2

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset conan-release

      - name: 🔨 Build
        run: |
          cmake --build --preset conan-release --parallel

  benchmark:
    needs: [setup]
    runs-on: ubuntu-24.04
    name: 📊 Benchmarks
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🐍 Install Conan
        run: |
          pipx install conan
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 📦 Install dependencies
        run: |
          conan install . -of build --version=${{ needs.setup.outputs.build-version }} -o with_benchmarks=True -o with_large_benchmarks=False --build=missing -s build_type=Release -s compiler.cppstd=23

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset conan-release

      - name: 🔨 Build
        run: |
          cmake --build --preset conan-release --parallel

      - name: 🏃 Run benchmarks
        run: |
          ./build/build/Release/benchmarks/utxoz_benchmarks

      - name: 🔄 Convert results
        run: |
          python3 scripts/convert_nanobench_json.py benchmark_results.json benchmark_results_gh.json

      - name: 📥 Fetch gh-pages history
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          else
            echo "gh-pages branch does not exist yet — skipping history fetch"
          fi

      - name: 📈 Compare against historical median
        run: |
          python3 scripts/benchmark_compare.py benchmark_results_gh.json \
            --window 10 --threshold 15 \
            --output benchmark_report.md
          cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-report
          path: benchmark_report.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Clean generated files
        run: |
          git checkout -- .

      - name: 📊 Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customBiggerIsBetter
          output-file-path: benchmark_results_gh.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
