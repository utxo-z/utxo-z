name: Build and Test

permissions:
  contents: read

# Every `run:` is bash, on every platform.
#
# The default on Windows runners is PowerShell, where $VAR is a PowerShell
# variable and not the environment — so a step reading $UTXOZ_BUILD_VERSION got
# an empty string there while working everywhere else. The recipe resolved as
# `utxoz/None` and the library was built as 0.0.0-dev, with every Windows job
# green, because a version nothing compares to is a version nothing notices.
#
# Audited before setting this: only `build` and `publish` run on Windows, and
# every step in them that is genuinely PowerShell — locating MSVC, entering the
# developer shell — already declares `shell: pwsh` and keeps it. The rest are
# plain commands that behave the same under either shell.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Pull-request revisions supersede each other. Release and hotfix publishing
  # must not be cancelled halfway through an artifact upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONAN_VERSION: 2.31.2

on:
  push:
    branches: [main, master, 'release/**', 'hotfix/**']
    tags:
      - v*
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 10
    outputs:
      build-version: ${{ steps.version.outputs.build-version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The refusals run before the version is derived, so a regression in the
      # pattern is a red build rather than a quiet widening. Every case is a
      # branch name somebody can push.
      - name: 🧪 Version derivation refuses what it should
        run: ./ci/test_determine_version.sh

      # The release scripts are only ever run by hand, so nothing else would
      # catch a regression in them until a release was already half-made.
      - name: 🧪 Release notes are generated once and carried
        run: ./scripts/test_release_lib.sh

      - name: 🔧 Determine version
        id: version
        uses: ./.github/actions/determine-version
        with:
          github-ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          run-number: ${{ github.run_number }}

      # Through the environment for the same reason as everywhere else: github.ref
      # is attacker-chosen on a pull request, and an expression in `run:` is
      # substituted into the script before the shell sees it.
      - name: 📊 Build configuration summary
        env:
          UTXOZ_BUILD_VERSION: ${{ steps.version.outputs.build-version }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "## Build Configuration"
            echo "**Version:** \`${UTXOZ_BUILD_VERSION}\`"
            echo "**Event:** ${EVENT_NAME}"
            echo "**Ref:** ${REF}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: 🐧 Linux x86_64 GCC 16
            runner-os: Linux
            runner-arch: X64
            compiler-kind: gcc
            compiler-major: 16
            configure-preset: conan-release
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: macos-26
            name: 🍎 macOS arm64 Xcode 26.6 / Apple Clang 21
            runner-os: macOS
            runner-arch: ARM64
            compiler-kind: apple-clang
            compiler-major: 21
            configure-preset: conan-release
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: windows-2025
            name: 🪟 Windows Server 2025 / VS 2026 (MSVC 14.44)
            runner-os: Windows
            runner-arch: X64
            compiler-kind: msvc
            compiler-major: 44
            configure-preset: conan-release
            build-preset: conan-release
            build-type: Release
            sanitizer: "none"
          - os: ubuntu-24.04
            name: 🧹 Linux x86_64 GCC 16 ASAN+UBSAN
            runner-os: Linux
            runner-arch: X64
            compiler-kind: gcc
            compiler-major: 16
            configure-preset: conan-debug
            build-preset: conan-debug
            build-type: Debug
            sanitizer: "address,undefined"

    runs-on: ${{ matrix.os }}
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 60
    name: ${{ matrix.name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select compiler
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install --yes gcc-16 g++-16
            echo "CC=gcc-16" >> "$GITHUB_ENV"
            echo "CXX=g++-16" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: 🔧 Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio installation not found' }
          $toolsetRoot = Join-Path $installation 'VC\Tools\MSVC'
          $toolset = Get-ChildItem $toolsetRoot -Directory |
            Where-Object Name -Like '14.44.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $toolset) { throw "MSVC 14.44 is not installed under $toolsetRoot" }
          $compiler = Join-Path $installation "VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $compiler)) { throw "MSVC x64 compiler not found at $compiler" }
          $devShell = Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44'
          @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') | ForEach-Object {
            $value = [Environment]::GetEnvironmentVariable($_)
            if ($value) { "$_=$value" >> $env:GITHUB_ENV }
          }
          "CXX=$compiler" >> $env:GITHUB_ENV
          "VSWHERE=$vswhere" >> $env:GITHUB_ENV

      # Fernando runs the release scripts by hand, from macOS. The Ubuntu copy of
      # this suite proves the logic; this one proves it survives BSD grep, sed
      # and wc, which differ from GNU in exactly the places these scripts touch:
      # character classes, -o counting, and the padding wc puts around a number.
      - name: 🧪 Release notes are generated once and carried (BSD tools)
        if: runner.os == 'macOS'
        run: ./scripts/test_release_lib.sh

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 🔧 Use selected MSVC with Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:USERPROFILE '.conan2\profiles\default'
          Add-Content $profile "`n[conf]`ntools.cmake.cmaketoolchain:generator=Ninja`ntools.microsoft.msbuild:vs_version=18"

      # Runs on each operating system, because the thing it catches is a
      # platform's checkout converting text to CRLF — which is invisible from any
      # other platform. Skipped on the sanitizer job only because it is the same
      # Linux checkout as the job above it.
      - name: 🧬 The recipe hashes the same everywhere
        if: matrix.sanitizer == 'none'
        shell: bash
        run: ./ci/check_recipe_reproducible.sh

      - name: 📦 Install dependencies
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan install . -of build --version="$UTXOZ_BUILD_VERSION" --build=missing -pr:h ci/conan-cpp23 -s build_type=${{ matrix.build-type }} -o "utxoz/*:sanitizer=${{ matrix.sanitizer }}"

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset ${{ matrix.configure-preset }}

      - name: 🧪 Verify configured toolchain
        env:
          EXPECTED_COMPILER_KIND: ${{ matrix.compiler-kind }}
          EXPECTED_COMPILER_MAJOR: ${{ matrix.compiler-major }}
          EXPECTED_XCODE: ${{ runner.os == 'macOS' && '26.6' || '' }}
          EXPECTED_VISUAL_STUDIO: ${{ runner.os == 'Windows' && '18' || '' }}
          EXPECTED_RUNNER_OS: ${{ matrix.runner-os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
          EXPECTED_CPPSTD: 23
          EXPECTED_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          CMAKE_CACHE: build/build/${{ matrix.build-type }}/CMakeCache.txt
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}
          path: toolchain-${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.sanitizer }}.json

      - name: 🔨 Build
        run: |
          cmake --build --preset ${{ matrix.build-preset }} --parallel

      # UTXOZ_TEST_TRACE makes the compatibility cases say where they are on
      # stderr. A case killed by a timeout reports nothing otherwise — Catch2
      # buffers until it has a result, and a killed case never has one.
      - name: 🧪 Run tests
        env:
          UTXOZ_TEST_TRACE: 1
        run: |
          ctest --preset ${{ matrix.build-preset }} --output-on-failure

      # The production figures, measured once per platform rather than in every
      # case. What differs between them is not the arithmetic — slots and group
      # metadata are the same everywhere — but the machinery the segment persists
      # beside them: the mutex is forty bytes on glibc and four in the spinlock
      # emulation, and the segment manager moves with it. A common minimum cannot
      # be assumed, so it is measured.
      #
      # Not on the sanitizer job: the numbers are about bytes on disk, and an
      # instrumented build would measure its own instrumentation.
      - name: 📏 Sizing profile for this platform
        if: matrix.sanitizer == 'none'
        shell: bash
        run: |
          set -euo pipefail
          # By exact name, and executable. A wildcard would also match
          # utxoz_sizing.pdb, an object file or a stale copy from another
          # configuration, and the first one found would be measured without
          # anybody noticing which.
          # Not `mapfile`: macOS runners ship bash 3.2, where it does not exist,
          # and the step died with "command not found" after every test had
          # already passed.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            candidates=$(find build -type f -name 'utxoz_sizing.exe')
          else
            candidates=$(find build -type f -name 'utxoz_sizing' -perm -u+x)
          fi
          found=$(printf '%s\n' "${candidates}" | grep -c '[^[:space:]]' || true)
          if [[ "${found}" -eq 0 ]]; then
            echo "the sizing tool was not built; nothing was measured" >&2
            exit 1
          fi
          if [[ "${found}" -gt 1 ]]; then
            # Choosing silently is how a report ends up describing a binary
            # nobody meant to run.
            echo "more than one sizing tool was found; which one is meant?" >&2
            printf '  %s\n' "${candidates}" >&2
            exit 1
          fi
          tool="${candidates}"
          # Which binary ran, said out loud: a report that cannot name the
          # executable behind it is a report nobody can reproduce.
          echo "tool: ${tool}"
          mkdir -p sizing-report

          # Every class at the capacity today's policy picks and at the step
          # above it, so the table is complete on every platform rather than
          # extrapolated from one.
          measure() {
            echo "--- class $1, $2 buckets ---"
            "${tool}" --class "$1" --buckets "$2" --precision 65536 --format json \
              --output "sizing-report/${1}-${2}.json"
            cat "sizing-report/${1}-${2}.json"
          }
          measure 48 7864319
          measure 48 15728639
          measure 96 3932159
          measure 96 7864319
          measure 128 3932159
          measure 128 7864319
          measure 256 122879
          measure 256 245759
          measure 10240 959
          measure 10240 1919
          measure reference 7864319
          measure reference 15728639

      - name: 📤 Upload the sizing profile
        if: matrix.sanitizer == 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sizing-${{ runner.os }}-${{ runner.arch }}
          path: sizing-report/

  publish:
    needs: [setup, build]
    if: >-
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: 📦 Publish Linux x86_64
            runner-os: Linux
            runner-arch: X64
            compiler-kind: gcc
            compiler-major: 16
          - os: macos-26
            name: 📦 Publish macOS arm64
            runner-os: macOS
            runner-arch: ARM64
            compiler-kind: apple-clang
            compiler-major: 21
          - os: windows-2025
            name: 📦 Publish Windows x64
            runner-os: Windows
            runner-arch: X64
            compiler-kind: msvc
            compiler-major: 44

    runs-on: ${{ matrix.os }}
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 60
    name: ${{ matrix.name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select compiler
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install --yes gcc-16 g++-16
            echo "CC=gcc-16" >> "$GITHUB_ENV"
            echo "CXX=g++-16" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: 🔧 Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio installation not found' }
          $toolsetRoot = Join-Path $installation 'VC\Tools\MSVC'
          $toolset = Get-ChildItem $toolsetRoot -Directory |
            Where-Object Name -Like '14.44.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $toolset) { throw "MSVC 14.44 is not installed under $toolsetRoot" }
          $compiler = Join-Path $installation "VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $compiler)) { throw "MSVC x64 compiler not found at $compiler" }
          $devShell = Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44'
          @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') | ForEach-Object {
            $value = [Environment]::GetEnvironmentVariable($_)
            if ($value) { "$_=$value" >> $env:GITHUB_ENV }
          }
          "CXX=$compiler" >> $env:GITHUB_ENV
          "VSWHERE=$vswhere" >> $env:GITHUB_ENV

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Configure Conan
        env:
          CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          conan profile detect --force
          conan remote add kth https://packages.kth.cash/api/
          conan remote login kth $CONAN_LOGIN_USERNAME -p $CONAN_PASSWORD

      - name: 🔧 Use selected MSVC with Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:USERPROFILE '.conan2\profiles\default'
          Add-Content $profile "`n[conf]`ntools.cmake.cmaketoolchain:generator=Ninja`ntools.microsoft.msbuild:vs_version=18"

      - name: 🧪 Verify toolchain
        env:
          EXPECTED_COMPILER_KIND: ${{ matrix.compiler-kind }}
          EXPECTED_COMPILER_MAJOR: ${{ matrix.compiler-major }}
          EXPECTED_XCODE: ${{ runner.os == 'macOS' && '26.6' || '' }}
          EXPECTED_VISUAL_STUDIO: ${{ runner.os == 'Windows' && '18' || '' }}
          EXPECTED_RUNNER_OS: ${{ matrix.runner-os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
          EXPECTED_CPPSTD: 23
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-publish-${{ runner.os }}.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-publish-${{ runner.os }}
          path: toolchain-publish-${{ runner.os }}.json

      # The same script the dry-run job runs on every pull request, so the
      # profile, the options and the consumer check cannot drift between what is
      # tested and what is released.
      - name: 📦 Create package
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: ./ci/create_package.sh

      - name: 🚀 Upload to Conan remote
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan upload "utxoz/$UTXOZ_BUILD_VERSION" -r kth -c

      # An upload reporting success is not evidence that the package can be
      # retrieved: utxoz/0.8.1 was uploaded on 2026-07-31 by three jobs that all
      # printed a complete upload summary, and it is not on the remote (#92).
      # This asks the remote from an empty cache, anonymously — so it sees what
      # a consumer sees, not what an authenticated session can reach.
      # UTXOZ_RECIPE_REVISION comes from the create step, which writes it to
      # GITHUB_ENV: the check is that *this* revision reached the remote, not
      # that something with the same name did.
      #
      # A separate remote name, anonymous: it reads what a consumer would get,
      # not what the authenticated session that just uploaded can see.
      #
      # Three layers, three results, and they are not ranked the same. The
      # release gate is that the exact recipe revision is on the remote and comes
      # back from an empty cache; a prebuilt binary is an acceleration, and a
      # consumer that compiles is a diagnostic. 0.9.1 published its recipe,
      # uploaded its Windows binary, and went red anyway because the consumer
      # included a header from a package it had not declared — a run that read as
      # a failed release (#113).
      #
      # Every failure below is still red. What changes is that the annotation
      # says which layer failed, and never says the recipe is missing when it is
      # not. The exit code is the script's own, passed through, so anything
      # reading this job can tell the four cases apart.
      - name: 🔍 The package is actually retrievable
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          UTXOZ_REMOTE: kth-verify
          UTXOZ_REMOTE_URL: https://packages.kth.cash/api/
        run: |
          verdict=0
          ./ci/verify_published.sh || verdict=$?
          reference="utxoz/$UTXOZ_BUILD_VERSION#${UTXOZ_RECIPE_REVISION:-unknown}"
          case ${verdict} in
            0) echo "ok: $reference published, binary retrieved, consumer runs" ;;
            3) echo "::error title=Release gate failed::$reference is not on kth-verify. The remote answered, and said so." ;;
            4) echo "::error title=Release gate undetermined::could not establish whether kth-verify has $reference. This is not absence and it is not a pass; re-run before concluding anything." ;;
            5) echo "::error title=Release gate failed::kth-verify lists $reference but the recipe did not come back into an empty cache." ;;
            6) echo "::error title=Binary missing — the recipe IS published::$reference is published and retrievable. No prebuilt binary for this platform came back under --build=never; consumers here will build from the recipe." ;;
            7) echo "::error title=Consumer check failed — the recipe IS published::$reference is published and retrievable, and its binary downloaded. The verification consumer did not compile, link or run." ;;
            *) echo "::error title=Verification failed unexpectedly::ci/verify_published.sh exited ${verdict}, which it has no meaning for." ;;
          esac
          exit ${verdict}

  build-wasm:
    needs: [setup]
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 45
    name: 🌐 WebAssembly (Emscripten)

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🌐 Install Emscripten 6.0.6
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.6
          actions-cache-folder: emsdk-cache

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Setup Conan profiles
        run: |
          conan profile detect --force

          cat > ~/.conan2/profiles/ems2 <<EOF
          [settings]
          arch=wasm
          build_type=Release
          compiler=clang
          compiler.cppstd=23
          compiler.libcxx=libc++
          compiler.version=21
          os=Emscripten

          [buildenv]
          CC_FOR_BUILD=clang
          CXX_FOR_BUILD=clang++

          [conf]
          tools.cmake.cmaketoolchain:user_toolchain=["$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"]
          EOF

      - name: 📦 Install dependencies
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan install . -of build --version="$UTXOZ_BUILD_VERSION" --build=missing -pr ems2

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset conan-release

      - name: 🧪 Verify configured toolchain
        env:
          EXPECTED_COMPILER_KIND: emscripten
          EXPECTED_COMPILER_MAJOR: 6
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
          EXPECTED_CPPSTD: 23
          EXPECTED_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          CMAKE_CACHE: build/build/Release/CMakeCache.txt
          CONAN_PROFILE: ems2
          TOOLCHAIN_MANIFEST: toolchain-Emscripten.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-Emscripten
          path: toolchain-Emscripten.json

      - name: 🔨 Build
        run: |
          cmake --build --preset conan-release --parallel

  boost-compatibility:
    needs: [setup]
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 60
    name: 🔭 Boost compatibility probe (informative)
    # Informative on purpose, and never required. A Boost release is not a defect
    # in whatever pull request happens to be open when it lands; what this job
    # produces is a verdict for a person to read before deciding whether
    # map_layout_epoch moves. It builds and runs code from the checked-out
    # revision and needs nothing but read access.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      # The pinned build first: the probe needs the generated config.hpp, and the
      # other dependencies come from the ordinary resolution. Only Boost is
      # replaced, and only for the probe.
      - name: 📦 Install dependencies
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan install . -of build --version="$UTXOZ_BUILD_VERSION" --build=missing -pr:h ci/conan-cpp23 -s build_type=Release

      - name: ⚙️ Configure CMake
        run: cmake --preset conan-release

      # The baseline half of the writer comparison. Without this the probe has
      # nothing written by the pinned Boost to compare against, and reports
      # NO_EVIDENCE for the writer — which is honest, and useless.
      - name: 🔨 Build the pinned-Boost generator
        run: |
          cmake --build --preset conan-release --target utxoz_make_format_fixtures --parallel

      # The comparison, checked against six cases whose answers are known —
      # including a file only the candidate writes, which an enumeration of one
      # side would never visit.
      - name: 🧪 The comparison can tell things apart
        run: ./ci/check_boost_latest.sh --self-test

      - name: 🔭 Probe a newer Boost
        env:
          # Pinned by version and checksum. A floating reference would leave a
          # run that cannot say which bytes it tested.
          BOOST_VERSION: "1.92.0"
          BOOST_SHA256: "e2a814b3a158ab482c7a3d330f8bf5a7a8423d258a4e2fb396996e00fcee2111"
        run: ./ci/check_boost_latest.sh

  generated-headers:
    needs: [setup]
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 30
    name: 🧬 Generated headers
    # This job builds and runs code from the checked-out revision, which on a
    # pull request is whatever the contributor pushed. It needs to read the
    # repository and nothing else.
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Otherwise the token is written into .git/config, where every build
          # step that follows can read it.
          persist-credentials: false

      - name: 🔧 Select GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 🧪 Verify toolchain
        env:
          EXPECTED_COMPILER_KIND: gcc
          EXPECTED_COMPILER_MAJOR: 16
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
          EXPECTED_CPPSTD: 23
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-generated-headers-Linux.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-generated-headers-Linux
          path: toolchain-generated-headers-Linux.json

      # Two build directories with opposite configurations, a stale header
      # planted in the source tree, and an install inspected afterwards. Every
      # check in here fails on the code that generated these headers into the
      # source tree, which is the only reason the job is worth its minutes.
      - name: 🧬 Generated headers belong to their build directory
        run: |
          ./ci/check_generated_headers.sh

      # conan create builds the package; only a consumer proves it is usable. A
      # header missing from the install is invisible here and fatal downstream.
      #
      # The version arrives through the environment and is quoted, as everywhere
      # else. The pattern check that used to sit here is gone: determine-version
      # now refuses a ref that does not yield a version, so the value cannot
      # reach any job unless it already is one. One check that nobody can forget
      # beats six that somebody eventually will.
      - name: 📦 Package is consumable
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan create . --version="$UTXOZ_BUILD_VERSION" --build=missing -pr:h ci/conan-cpp23 -s build_type=Release -o "utxoz/*:with_tests=False" -o "utxoz/*:with_examples=False" -o "utxoz/*:with_benchmarks=False"

  statistics-disabled:
    needs: [setup]
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 60
    name: 📉 Statistics disabled
    # Builds and runs code from the checked-out revision; it needs to read the
    # repository and nothing else.
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 📦 Install dependencies
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan install . -of build --version="$UTXOZ_BUILD_VERSION" --build=missing -pr:h ci/conan-cpp23 -s build_type=Release -o "utxoz/*:statistics=False"

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset conan-release

      - name: 🧪 Verify configured toolchain
        env:
          EXPECTED_COMPILER_KIND: gcc
          EXPECTED_COMPILER_MAJOR: 16
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
          EXPECTED_CPPSTD: 23
          EXPECTED_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          CMAKE_CACHE: build/build/Release/CMakeCache.txt
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-statistics-disabled-Linux.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-statistics-disabled-Linux
          path: toolchain-statistics-disabled-Linux.json

      # The build was never the problem: statistics=False has always compiled
      # clean. What was broken only showed up when the tests ran, so a job that
      # stopped at compilation would have gone green over it.
      - name: 🧪 Verify statistics really are compiled out
        run: |
          if grep -q '^#define UTXOZ_STATISTICS_ENABLED' build/build/Release/include/utxoz/config.hpp; then
            echo "this job is supposed to build with statistics disabled" >&2
            exit 1
          fi

      - name: 🔨 Build
        run: |
          cmake --build --preset conan-release --parallel

      - name: 🧪 Run tests
        run: |
          ctest --preset conan-release --output-on-failure

      # The compatibility cases are only built when the fixtures are present, so
      # a mistake in that condition would take them out of the suite and leave
      # this job green without them.
      #
      # The suite is asked by tag rather than ctest by name pattern: names are a
      # heuristic that both misses cases and matches unrelated ones, and a count
      # that includes tests which are not these proves nothing about these.
      - name: 🧪 Verify the compatibility cases actually ran
        run: |
          suite=$(find build -type f -name utxoz_tests -perm -u+x -print -quit)
          if [[ -z "${suite}" ]]; then
            echo "the test binary was not found; nothing can be said about coverage" >&2
            exit 1
          fi
          # One line per case, so the count does not depend on how Catch2
          # words its summary or indents its listing.
          count=$("${suite}" '[compat]' --list-tests --verbosity quiet | grep -c '[^[:space:]]' || true)
          echo "[compat] cases in this build: ${count:-0}"
          if [[ "${count:-0}" -lt 8 ]]; then
            echo "the format compatibility cases are missing from this build" >&2
            exit 1
          fi

  publish-dry-run:
    needs: [setup]
    # The same platforms publish runs on, because the thing being rehearsed is
    # platform-specific. A Linux-only dry run said the package was consumable
    # while the Windows one could not link at all: `conan create` — and with it
    # test_package, the only consumer that exists — ran on Windows exclusively
    # inside publish, which no pull request executes. The gap was found by a
    # release rather than by CI, which is the wrong order.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: 📦 Publish dry run Linux
            compiler-kind: gcc
            compiler-major: 16
            runner-os: Linux
            runner-arch: X64
          - os: macos-26
            name: 📦 Publish dry run macOS
            compiler-kind: apple-clang
            compiler-major: 21
            runner-os: macOS
            runner-arch: ARM64
          - os: windows-2025
            name: 📦 Publish dry run Windows
            compiler-kind: msvc
            compiler-major: 44
            runner-os: Windows
            runner-arch: X64

    runs-on: ${{ matrix.os }}
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 45
    name: ${{ matrix.name }}
    # Builds and runs code from the checked-out revision, which on a pull request
    # is whatever the contributor pushed. Read the repository and nothing else —
    # and note there are no secrets here at all.
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select compiler
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install --yes gcc-16 g++-16
            echo "CC=gcc-16" >> "$GITHUB_ENV"
            echo "CXX=g++-16" >> "$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: 🔧 Locate MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Visual Studio installation not found' }
          $toolsetRoot = Join-Path $installation 'VC\Tools\MSVC'
          $toolset = Get-ChildItem $toolsetRoot -Directory |
            Where-Object Name -Like '14.44.*' |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if (-not $toolset) { throw "MSVC 14.44 is not installed under $toolsetRoot" }
          $compiler = Join-Path $installation "VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $compiler)) { throw "MSVC x64 compiler not found at $compiler" }
          $devShell = Join-Path $installation 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64 -vcvars_ver=14.44'
          @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') | ForEach-Object {
            $value = [Environment]::GetEnvironmentVariable($_)
            if ($value) { "$_=$value" >> $env:GITHUB_ENV }
          }
          "CXX=$compiler" >> $env:GITHUB_ENV
          "VSWHERE=$vswhere" >> $env:GITHUB_ENV

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      # A cache of its own, so nothing resolves out of a previous job's leftovers
      # and the consumer check has to come from the package just built.
      - name: 🔧 Configure Conan in an empty cache
        run: |
          echo "CONAN_HOME=$RUNNER_TEMP/dry-run-conan" >> "$GITHUB_ENV"

      - name: 🔧 Detect the profile
        run: |
          conan profile detect --force

      - name: 🔧 Use selected MSVC with Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $profile = Join-Path $env:CONAN_HOME 'profiles\default'
          Add-Content $profile "`n[conf]`ntools.cmake.cmaketoolchain:generator=Ninja`ntools.microsoft.msbuild:vs_version=18"

      # The remote query's outcomes, against a conan that answers exactly what
      # each case needs. A real remote cannot be asked to fail on cue, and these
      # are the failures that decide whether a release is believed.
      #
      # Linux only, and deliberately. Both programs under test are Python with no
      # platform-specific behaviour, so once is enough — while the harness is
      # POSIX by construction: it replaces conan with an extensionless shell
      # script on PATH, which Windows will not resolve, so every case there ends
      # up asking the real remote and reporting "could not determine".
      - name: 🧪 The remote query tells absent from unreachable
        if: runner.os == 'Linux'
        run: |
          ./ci/test_remote_revisions.sh
          ./ci/test_one_revision.sh
          ./ci/test_await_published.sh
          ./ci/test_verify_published.sh
          ./ci/test_verify_consumer.sh

      - name: 🧪 Verify toolchain
        env:
          EXPECTED_COMPILER_KIND: ${{ matrix.compiler-kind }}
          EXPECTED_COMPILER_MAJOR: ${{ matrix.compiler-major }}
          EXPECTED_XCODE: ${{ runner.os == 'macOS' && '26.6' || '' }}
          EXPECTED_VISUAL_STUDIO: ${{ runner.os == 'Windows' && '18' || '' }}
          EXPECTED_RUNNER_OS: ${{ matrix.runner-os }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner-arch }}
          EXPECTED_CPPSTD: 23
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-publish-dry-run-${{ runner.os }}.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-publish-dry-run-${{ runner.os }}
          path: toolchain-publish-dry-run-${{ runner.os }}.json

      # Everything the real publish does before it touches the network. It cannot
      # upload: this cache has no `kth` remote to write to, which the next step
      # asserts rather than assumes.
      - name: 📦 Create the package and prove a consumer can use it
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: ./ci/create_package.sh

      - name: 🚫 Nothing was published
        run: |
          if conan remote list | grep -qi 'kth'; then
            echo "the dry run has a publishing remote configured; it must not" >&2
            conan remote list >&2
            exit 1
          fi
          echo "ok: no publishing remote exists in this cache, so no upload was possible"

      # The diagnostic layer of the release verification, run for real on every
      # platform the release runs on — Windows included, which is where it broke
      # — and then required to fail.
      #
      # The failing half is the point. Until 0.9.1 nothing had ever established
      # that this check could fail: it had only ever been run against a package
      # it was expected to work with. A check nobody has seen fail is not known
      # to be able to, and the day it finally did fail it failed for the wrong
      # reason — an undeclared fmt include rather than anything about utxoz
      # (#113).
      #
      # So the same consumer is built twice against the same installed package:
      # as it ships, which must work, and with its utxoz dependency stripped out,
      # which must not. The second run is the one that gives the first its
      # meaning.
      - name: 🧪 The consumer check passes, and can fail
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          install_dir="$RUNNER_TEMP/consumer-install"
          rm -rf "$install_dir"
          conan install --requires="utxoz/$UTXOZ_BUILD_VERSION" --build=never --lockfile-partial \
            -pr:h ci/conan-cpp23 -s build_type=Release \
            -o "utxoz/*:with_tests=False" -o "utxoz/*:with_examples=False" -o "utxoz/*:with_benchmarks=False" \
            -g CMakeDeps -g CMakeToolchain -of "$install_dir"

          echo "== the consumer as it ships must work =="
          # Captured rather than just run: the success line is what says the
          # search identified one executable and ran that one. On Windows the
          # name carries a .exe and the filesystem reports ordinary files as
          # executable, so "it exited 0" is not by itself evidence that the thing
          # it ran was the consumer.
          ./ci/verify_consumer.sh "$install_dir" test_package | tee consumer.log
          if ! grep -q "ok: the consumer configures, builds and runs" consumer.log; then
            echo "the consumer check passed without reporting a run" >&2
            exit 1
          fi

          echo
          echo "== and the same consumer without utxoz must not =="
          stripped="$RUNNER_TEMP/consumer-without-utxoz"
          rm -rf "$stripped"
          cp -r test_package "$stripped"
          # `conan create` leaves a build tree inside test_package; copying it
          # would hand the negative control an executable from the run that
          # passed, which is exactly the way this control would go vacuous.
          rm -rf "$stripped/build"
          grep -v 'utxoz' test_package/CMakeLists.txt > "$stripped/CMakeLists.txt"

          negative=0
          ./ci/verify_consumer.sh "$install_dir" "$stripped" || negative=$?
          if [[ ${negative} -eq 0 ]]; then
            echo "::error title=The consumer check is vacuous::a consumer that never declares utxoz configured, built and ran. The check cannot fail, so its passing says nothing." >&2
            exit 1
          fi
          echo "ok: removing the utxoz dependency fails the consumer check (exit ${negative})"

      # The post-upload verification runs only during a release, so nothing would
      # exercise it until the day it matters. Here it is pointed at a version the
      # remote cannot have, and required to say so — in those words.
      #
      # Asserting the message rather than merely a non-zero exit is the point: an
      # unreachable remote also fails, and a control that accepted any failure
      # would pass while proving nothing.
      # The window is seconds rather than the release default, because what is
      # under test here is which answer comes back, not how long a real remote is
      # given to publish. At the default this control would spend five minutes
      # per platform, on every pull request, waiting for a version that cannot
      # arrive.
      - name: 🧪 The post-upload check can tell absent from unreachable
        env:
          UTXOZ_BUILD_VERSION: 0.0.0-never-published
          UTXOZ_RECIPE_REVISION: 00000000000000000000000000000000
          UTXOZ_REMOTE: kth-verify
          UTXOZ_REMOTE_URL: https://packages.kth.cash/api/
          UTXOZ_PUBLISH_TIMEOUT: 10
        run: |
          status=0
          ./ci/verify_published.sh > verify.log 2>&1 || status=$?
          cat verify.log
          # 3 is absence and 4 is not knowing; the exit code is asserted rather
          # than the wording because it is the thing the release branches on, and
          # a control that accepts any failure would pass on an unreachable
          # remote while proving nothing.
          case ${status} in
            0) echo "the check passed for a version that was never published" >&2; exit 1 ;;
            3) echo "ok: absence is reported as absence" ;;
            4) echo "it could not reach the remote, so this proves nothing about absence" >&2; exit 1 ;;
            *) echo "it failed for some other reason (${status}); this proves nothing" >&2; exit 1 ;;
          esac
          if ! grep -q "did not appear on kth-verify" verify.log; then
            echo "it exited 3 without saying why; the message the release is read from is missing" >&2
            exit 1
          fi
          # The verdict has to name the layer that failed, and only that layer.
          if ! grep -q "REQUIRED   recipe published and retrievable : ABSENT" verify.log; then
            echo "the verdict does not report the required gate as absent" >&2
            exit 1
          fi
          # Nothing below the gate ran, so nothing below it may be blamed.
          if ! grep -q "OPTIONAL   binary for this platform         : not attempted" verify.log; then
            echo "the verdict blames a layer that never ran" >&2
            exit 1
          fi

      # The other half of the same distinction, and the one that costs releases:
      # a remote that cannot be reached has told us nothing. Absence is a claim,
      # and this must refuse to make it.
      #
      # Port 9 is discard: the connection is refused immediately, so this asks a
      # question that cannot be answered without waiting for a timeout to prove
      # it. The version here is a real one — the point is the remote, not the
      # reference.
      - name: 🧪 An unreachable remote is not an absent package
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          UTXOZ_RECIPE_REVISION: 00000000000000000000000000000000
          UTXOZ_REMOTE: kth-verify
          UTXOZ_REMOTE_URL: https://127.0.0.1:9/
          UTXOZ_PUBLISH_TIMEOUT: 10
        run: |
          status=0
          ./ci/verify_published.sh > unreachable.log 2>&1 || status=$?
          cat unreachable.log
          case ${status} in
            0) echo "an unreachable remote reported success" >&2; exit 1 ;;
            4) echo "ok: not knowing is reported as not knowing" ;;
            3) echo "::error::an unreachable remote was reported as a package that is not there" >&2; exit 1 ;;
            *) echo "it failed for some other reason (${status}); this proves nothing" >&2; exit 1 ;;
          esac
          # The words matter as much as the code here: this is the sentence that
          # stops somebody re-cutting a release that may already be published.
          if ! grep -q "UNDETERMINED" unreachable.log; then
            echo "it exited 4 without saying the gate is undetermined" >&2
            exit 1
          fi
          if grep -q "did not appear on kth-verify" unreachable.log; then
            echo "it exited 4 while claiming the package is not there" >&2
            exit 1
          fi

  benchmark:
    needs: [setup]
    runs-on: ubuntu-24.04
    # A stuck job otherwise runs to the six-hour default, blocking the matrix
    # and reporting nothing about which step it was in.
    timeout-minutes: 60
    name: 📊 Benchmarks
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: 🔧 Select GCC 16
        shell: bash
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: 🐍 Install Conan
        run: |
          pipx install conan==${{ env.CONAN_VERSION }}
          conan --version

      - name: 🔧 Configure Conan
        run: |
          conan profile detect --force

      - name: 📦 Install dependencies
        env:
          UTXOZ_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
        run: |
          conan install . -of build --version="$UTXOZ_BUILD_VERSION" -o "utxoz/*:with_benchmarks=True" -o "utxoz/*:with_large_benchmarks=False" --build=missing -pr:h ci/conan-cpp23 -s build_type=Release

      - name: ⚙️ Configure CMake
        run: |
          cmake --preset conan-release

      - name: 🧪 Verify configured toolchain
        env:
          EXPECTED_COMPILER_KIND: gcc
          EXPECTED_COMPILER_MAJOR: 16
          EXPECTED_RUNNER_OS: Linux
          EXPECTED_RUNNER_ARCH: X64
          EXPECTED_CPPSTD: 23
          EXPECTED_BUILD_VERSION: ${{ needs.setup.outputs.build-version }}
          CMAKE_CACHE: build/build/Release/CMakeCache.txt
          CONAN_PROFILE: ci/conan-cpp23
          TOOLCHAIN_MANIFEST: toolchain-benchmark-Linux.json
        run: python3 scripts/ci_toolchain_manifest.py

      - name: 📤 Upload toolchain manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-benchmark-Linux
          path: toolchain-benchmark-Linux.json

      - name: 🔨 Build
        run: |
          cmake --build --preset conan-release --parallel

      - name: 🏃 Run benchmarks
        run: |
          ./build/build/Release/benchmarks/utxoz_benchmarks

      - name: 🔄 Convert results
        run: |
          python3 scripts/convert_nanobench_json.py benchmark_results.json benchmark_results_gh.json

      - name: 📥 Fetch gh-pages history
        run: |
          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          else
            echo "gh-pages branch does not exist yet — skipping history fetch"
          fi

      - name: 📈 Compare against historical median
        run: |
          python3 scripts/benchmark_compare.py benchmark_results_gh.json \
            --window 10 --threshold 15 \
            --output benchmark_report.md
          cat benchmark_report.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: benchmark-report
          path: benchmark_report.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Clean generated files
        run: |
          git checkout -- .

      - name: 📊 Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          tool: customBiggerIsBetter
          output-file-path: benchmark_results_gh.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
