name: 'Determine Version'
description: 'Calculates the version tag based off the git reference'
inputs:
  github-ref:
    description: 'The current reference point for the version'
    required: true
  run-number:
    description: 'Github Run Number'
    required: true

outputs:
  build-version:
    description: "Build Version"
    value: ${{ steps.cal.outputs.version }}
runs:
  using: "composite"
  steps:
  # The inputs arrive through the environment, not through ${{ }} expanded into
  # the script text. An expression in `run:` is substituted before the shell
  # sees it, so quoting at the point of use cannot help: `github-ref` is a
  # branch name on a pull request, and a branch called release/$(id) would be
  # command substitution in the assignment itself — inside this action, before
  # any output exists to validate.
  #
  # The derivation and its check live in ci/determine_version.sh, so that the
  # thing under test in ci/test_determine_version.sh is the thing that runs.
  - id: cal
    env:
      GITHUB_REF_INPUT: ${{ inputs.github-ref }}
      RUN_NUMBER: ${{ inputs.run-number }}
    shell: bash
    run: |
      set -eu
      # Checked explicitly rather than left to `set -e`. Whether a failed command
      # substitution inside an assignment aborts is a shell-dependent detail, and
      # what rides on it here is an empty version reaching `conan create`.
      if ! version="$("${GITHUB_WORKSPACE}/ci/determine_version.sh")"; then
        echo "::error::the ref does not yield a version; refusing to build" >&2
        exit 1
      fi
      if [[ -z "${version}" ]]; then
        echo "::error::the version derivation produced nothing" >&2
        exit 1
      fi
      printf 'build version: %s\n' "${version}"
      printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
